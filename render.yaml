# Render Blueprint: New → Blueprint → select this repo. Secrets are entered in the dashboard.
services:
  - type: web
    name: sungrid-copilot
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: streamlit run app.py --server.port $PORT --server.address 0.0.0.0 --server.headless true
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.3
      - key: OPENROUTER_API_KEY
        sync: false
      # Must be Qdrant Cloud: Render's disk is ephemeral, so local mode would start empty.
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: TYPESAFE_API_KEY
        sync: false
      # Strongly recommended for a public URL, so strangers can't spend your API credits.
      - key: APP_PASSWORD
        sync: false
